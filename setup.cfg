[metadata]
name = mkai
version = 0.1.0
description = AI-powered mkdir — describe a project in natural language, get English name suggestions, and cd in
requires_python = >=3.9
install_requires =
    requests>=2.28

[options]
packages = find:
package_dir =
    = src

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    mkai = mkai.cli:main
